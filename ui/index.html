<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pydocs AI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Syntax Highlighting Dark Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  
  <!-- Markdown Parser & Highlighter Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <!-- Ambient Background Glows -->
  <div class="glow glow-top-left"></div>
  <div class="glow glow-top-right"></div>
  <div class="glow glow-bottom-left"></div>
  <div class="glow glow-bottom-right"></div>
  <div class="glow glow-center"></div>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="logo.png" alt="Pydocs AI Logo" class="app-logo">
        <span class="app-title">Pydocs AI</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      
      <!-- Hero Center View (Initial State) -->
      <section class="hero-section" id="heroSection">
        <h1 class="hero-title">Where knowledge meets intelligence.</h1>
        <p class="hero-subtitle">Ask anything about Pydantic-AI docs or choose a topic below to start.</p>

        <!-- Suggested Prompt Cards -->
        <div class="suggestions-grid">
          <button class="suggestion-card" onclick="sendSuggestedQuery('What is Pydantic AI?')">
            <span class="card-title">What is Pydantic AI?</span>
            <span class="card-desc">Overview of the framework features</span>
          </button>

          <button class="suggestion-card" onclick="sendSuggestedQuery('How to define agents in Pydantic AI?')">
            <span class="card-title">Define Agents</span>
            <span class="card-desc">Syntax and practical structure</span>
          </button>

          <button class="suggestion-card" onclick="sendSuggestedQuery('How to use tools and dependencies?')">
            <span class="card-title">Tools & Dependencies</span>
            <span class="card-desc">Function calling setup guide</span>
          </button>

          <button class="suggestion-card" onclick="sendSuggestedQuery('How does result validation work?')">
            <span class="card-title">Result Validation</span>
            <span class="card-desc">Structured outputs & validation</span>
          </button>

          <button class="suggestion-card" onclick="sendSuggestedQuery('Provide a complete code example')">
            <span class="card-title">Code Example</span>
            <span class="card-desc">Full working Python agent code</span>
          </button>
        </div>
      </section>

      <!-- Chat Messages Container -->
      <section class="chat-container hidden" id="chatContainer">
        <div class="chat-messages" id="chatBox"></div>
      </section>

    </main>

    <!-- Footer Input Dock -->
    <footer class="input-dock">
      <div class="input-box-wrapper">
        <textarea id="userInput" placeholder="Ask Pydocs AI anything..." rows="1"></textarea>
        <button id="sendBtn" class="send-btn" aria-label="Send message">
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
          <div class="spinner hidden" id="btnSpinner"></div>
        </button>
      </div>
      <p class="disclaimer">Pydocs AI can make mistakes. Verify important information from official docs.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
